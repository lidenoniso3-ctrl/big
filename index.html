<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفعيل الترخيص - SEO Platform</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- هذا هو الغلاف الذي كان ناقصاً -->
  <div class="auth-wrap">
    <main class="auth-box">
      <h1>أدخل مفتاح الترخيص</h1>
      <p class="sub">يرجى إدخال المفتاح الذي حصلت عليه بعد الشراء لتفعيل حسابك.</p>
      
      <form id="licenseForm">
        <label for="licenseKey">مفتاح الترخيص</label>
        <input id="licenseKey" type="text" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX" required>
        <button type="submit" class="primary">تفعيل</button>
      </form>
      
      <p id="msg" class="msg"></p>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    document.getElementById("licenseForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const key = document.getElementById("licenseKey").value.trim();
      const msg = document.getElementById("msg");
      
      msg.className = "msg info";
      msg.innerHTML = '<span class="spinner"></span> جارٍ التحقق...';
      
      try {
        await verifyLicense(key);
        msg.className = "msg ok";
        msg.textContent = "تم التفعيل بنجاح! جارٍ التحويل...";
        setTimeout(() => window.location.href = "dashboard.html", 800);
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
